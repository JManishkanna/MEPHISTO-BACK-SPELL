<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">ManishKannaJ. portfolio social preview</title>
  <desc id="description">Portfolio preview with a red gradient and developer title.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#090307"/>
      <stop offset="1" stop-color="#251019"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff263f"/>
      <stop offset="1" stop-color="#ff744f"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#ff263f" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff263f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="1040" cy="120" rx="420" ry="330" fill="url(#glow)"/>
  <circle cx="1100" cy="480" r="210" fill="none" stroke="#ff5268" stroke-opacity=".18" stroke-width="2"/>
  <circle cx="1100" cy="480" r="150" fill="none" stroke="#ff5268" stroke-opacity=".13" stroke-width="2"/>
  <rect x="82" y="100" width="78" height="78" rx="24" fill="url(#accent)"/>
  <text x="202" y="145" fill="#e7eefb" font-family="Arial,sans-serif" font-size="24" font-weight="700">MEPHISTO.NET</text>
  <text x="202" y="174" fill="#9db0c9" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">PORTFOLIO</text>
  <text x="82" y="328" fill="#f4f6fb" font-family="Arial,sans-serif" font-size="70" font-weight="700">ManishKannaJ.</text>
  <text x="84" y="390" fill="#ff6879" font-family="Arial,sans-serif" font-size="31" font-weight="600">Java Full Stack Developer</text>
  <text x="84" y="448" fill="#b8c5d8" font-family="Arial,sans-serif" font-size="22">Projects · Skills · Software development</text>
  <rect x="84" y="496" width="220" height="5" rx="3" fill="url(#accent)"/>
